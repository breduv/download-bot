services:
  download-bot:
    image: download-bot:${IMAGE_TAG:-latest}

    build:
      context: .
      dockerfile: Dockerfile

    container_name: download-bot

    restart: unless-stopped

    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      MEDIA_PROXY: ${MEDIA_PROXY}
      TELEGRAM_PROXY: ${TELEGRAM_PROXY}
      LOG_LEVEL: ${LOG_LEVEL}
      SEARCH_LIMIT: ${SEARCH_LIMIT}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB}
      INLINE_CACHE_CHAT_ID: ${INLINE_CACHE_CHAT_ID}
      METRICS_PORT: ${METRICS_PORT:-9101}
      TELEGRAM_HEALTH_INTERVAL_SECONDS: ${TELEGRAM_HEALTH_INTERVAL_SECONDS:-30}

    expose:
      - "${METRICS_PORT:-9101}"

    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    networks:
      - default
      - monitoring

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "1"

networks:
  monitoring:
    external: true
    name: monitoring
